<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Protocolos" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Tu dia organizado segun tu reloj biologico: luz, cafeina, ejercicio, temperatura y descanso, con herramientas guiadas para el estres y el sueno."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Protocolos</title>
    <script>
      // Aplica la apariencia guardada antes de pintar, para evitar un parpadeo.
      try {
        var t = JSON.parse(localStorage.getItem('ritmo-diario:v1:theme') || '"system"');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Necesitas activar JavaScript para usar Protocolos.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
